# /etc/nginx/sites-available/plataforma-advogado.ivillar.com.br
# Depois: ln -s ../sites-available/plataforma-advogado.ivillar.com.br /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
#         certbot --nginx -d plataforma-advogado.ivillar.com.br
server {
    listen 80;
    server_name plataforma-advogado.ivillar.com.br;

    client_max_body_size 220m; # até 10 arquivos de 20 MB no portal

    location /api/ {
        proxy_pass http://127.0.0.1:3340/;   # a barra final remove o /api/
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
